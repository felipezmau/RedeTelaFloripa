<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Gerador de orçamento — RedeTela</title>
<style>
  :root {
    --ink: #101223; --ink-soft: #63678C; --paper: #F6F4EE; --panel: #FFFFFF;
    --line: #E1DCCC; --primary: #00009E; --primary-soft: #E4E4F7;
    --coral: #E8532A; --good: #147A4F; --good-soft: #DEF0E6;
    color-scheme: light;
  }
  :root:not([data-theme="light"]) { @media (prefers-color-scheme: dark) {
    --ink: #ECEAF5; --ink-soft: #A7ABD1; --paper: #0E1030; --panel: #171A3E;
    --line: #2E3260; --primary: #8C8CFF; --primary-soft: #24265A;
    --coral: #FF8A63; --good: #6FDBA8; --good-soft: #123626; color-scheme: dark;
  }}
  :root[data-theme="dark"] {
    --ink: #ECEAF5; --ink-soft: #A7ABD1; --paper: #0E1030; --panel: #171A3E;
    --line: #2E3260; --primary: #8C8CFF; --primary-soft: #24265A;
    --coral: #FF8A63; --good: #6FDBA8; --good-soft: #123626; color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  h1, h2, .total-num { font-family: 'Space Grotesk', 'Inter', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .wrap { max-width: 540px; margin: 0 auto; padding: 22px 18px 40px; }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
  .brand .mark { width: 9px; height: 9px; background: var(--primary); transform: rotate(45deg); flex: none; }
  .brand span { font-size: 13px; color: var(--ink-soft); }
  h1.page-title { font-size: 21px; font-weight: 600; margin: 0 0 20px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  label { font-size: 12.5px; color: var(--ink-soft); display: block; margin-bottom: 5px; }
  input[type=text], input[type=number] {
    width: 100%; border: 1px solid var(--line); border-radius: 9px; background: var(--paper);
    color: var(--ink); padding: 10px 11px; font-size: 14.5px; font-family: inherit;
  }
  input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .field { margin-bottom: 14px; }

  .row-item {
    border: 1px solid var(--line); border-radius: 12px; padding: 13px; margin-bottom: 10px;
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; gap: 8px; align-items: end;
  }
  @media (max-width: 480px) { .row-item { grid-template-columns: 1fr 1fr; } }
  .row-item .full { grid-column: 1 / -1; }
  .row-item select {
    width: 100%; border: 1px solid var(--line); border-radius: 9px; background: var(--paper);
    color: var(--ink); padding: 10px 8px; font-size: 14px; font-family: inherit;
  }
  .row-item .rm {
    border: none; background: none; color: var(--coral); font-size: 13px; cursor: pointer;
    padding: 8px 4px; white-space: nowrap;
  }

  .add-btn {
    width: 100%; border: 1.5px dashed var(--line); background: none; color: var(--primary);
    border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;
  }

  .summary { display: flex; gap: 20px; flex-wrap: wrap; }
  .summary div .n { font-size: 19px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .summary div .l { font-size: 11.5px; color: var(--ink-soft); }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .total-row .lbl { font-size: 13.5px; color: var(--ink-soft); }
  .total-row .val { font-size: 24px; font-weight: 600; color: var(--primary); font-family: 'IBM Plex Mono', monospace; }

  .gen-btn {
    width: 100%; background: var(--primary); color: white; border: none; border-radius: 12px;
    padding: 15px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 4px;
  }

  .link-box { display: none; }
  .link-box.show { display: block; }
  .link-box .url {
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; word-break: break-all;
    background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 11px;
    margin-bottom: 10px; color: var(--ink-soft);
  }
  .link-actions { display: flex; gap: 8px; }
  .link-actions button, .link-actions a {
    flex: 1; text-align: center; text-decoration: none; padding: 11px; border-radius: 9px;
    font-size: 13.5px; font-weight: 500; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font-family: inherit;
  }
  .link-actions .primary { background: var(--good-soft); border-color: var(--good); color: var(--good); }

  .hist-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px 4px; border-top: 1px solid var(--line);
  }
  .hist-item:first-child { border-top: none; }
  .hist-item .info .d { font-size: 13.5px; font-weight: 500; }
  .hist-item .info .t { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .hist-item .right { text-align: right; flex: none; }
  .hist-item .right .val { font-size: 14px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .hist-item .right button {
    border: none; background: none; color: var(--primary); font-size: 12px;
    cursor: pointer; font-family: inherit; padding: 2px 0;
  }
  .hist-empty { font-size: 13px; color: var(--ink-soft); padding: 6px 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark"></div><span>REDETELA · USO INTERNO</span></div>
  <h1 class="page-title">Gerador de orçamento</h1>

  <div class="card">
    <div class="field">
      <label for="desc">Título do orçamento (o cliente vê isso)</label>
      <input type="text" id="desc" value="Rede de proteção — sacada e 2 janelas">
    </div>
    <div class="field" style="margin-bottom:0;">
      <label for="precoM2">Preço por m² neste orçamento (R$)</label>
      <input type="number" id="precoM2" step="1" min="0" value="75" oninput="calc()">
    </div>
  </div>

  <div class="card">
    <label style="margin-bottom:10px;">Aberturas</label>
    <div id="rows"></div>
    <button class="add-btn" onclick="addRow()">+ Adicionar abertura</button>
  </div>

  <div class="card">
    <div class="summary">
      <div><div class="n mono" id="s-area">0,00</div><div class="l">m² total</div></div>
      <div><div class="n mono" id="s-perim">0,0</div><div class="l">m perímetro</div></div>
      <div><div class="n mono" id="s-ganchos">0</div><div class="l">ganchos</div></div>
    </div>
    <div class="total-row">
      <div class="lbl">Valor base (gancho zincado)</div>
      <div class="val mono" id="s-total">R$ 0,00</div>
    </div>
  </div>

  <button class="gen-btn" onclick="gerar()">Gerar link do cliente</button>

  <div class="card link-box" id="linkBox">
    <label>Link pronto — envie este pro cliente</label>
    <div class="url" id="linkUrl"></div>
    <div class="link-actions">
      <button onclick="copiarLink()">Copiar link</button>
      <a href="#" target="_blank" id="linkOpen" class="primary">Abrir</a>
    </div>
  </div>

  <div class="card" id="histCard" style="display:none;">
    <label style="margin-bottom:10px;">Histórico de orçamentos</label>
    <div id="histList"></div>
  </div>
</div>

<script>
  // mesmos preços da proposta — mantenha os dois arquivos sincronizados
  const PRECO_CORDA_M = 0.50;
  const M_LINEAR_POR_GANCHO = 0.35;
  const PRECO_GANCHO_ZINCADO = 0.50;

  // troque pela URL onde a proposta.html está publicada
  const PROPOSTA_URL = 'https://redetelafloripa.com/proposta.html';

  // banco de dados do artifact — guarda seu histórico de orçamentos gerados.
  // Só você (dono do artifact) usa isso; a página do cliente não depende disso.
  let db = null;
  (async () => {
    try {
      db = await claude.use('db');
      if (db) carregarHistorico();
    } catch(e) { /* segue sem histórico */ }
  })();

  async function carregarHistorico(){
    if (!db) return;
    try {
      const snap = await db.collection('orcamentos').orderBy('createdAt', 'desc').limit(30).get();
      const list = document.getElementById('histList');
      const card = document.getElementById('histCard');
      if (snap.empty){ card.style.display = 'none'; return; }
      card.style.display = 'block';
      list.innerHTML = '';
      snap.docs.forEach(doc => {
        const d = doc.data();
        const dt = d.createdAt ? new Date(d.createdAt) : null;
        const dataStr = dt ? dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : '—';
        const row = document.createElement('div');
        row.className = 'hist-item';
        row.innerHTML = `
          <div class="info">
            <div class="d">${d.desc || 'Orçamento'}</div>
            <div class="t">${dataStr} · R$${d.precoM2}/m²</div>
          </div>
          <div class="right">
            <div class="val">${fmt(d.baseTotal || 0)}</div>
            <button onclick="navigator.clipboard.writeText('${d.link}'); this.textContent='copiado!'; setTimeout(()=>this.textContent='copiar link',1200);">copiar link</button>
          </div>
        `;
        list.appendChild(row);
      });
    } catch(e) { /* falha silenciosa — histórico é conveniência, não requisito */ }
  }

  let rowCount = 0;
  function addRow(tipo, larg, alt, qtd){
    rowCount++;
    const id = 'row' + rowCount;
    const div = document.createElement('div');
    div.className = 'row-item';
    div.id = id;
    div.innerHTML = `
      <div>
        <label>Tipo</label>
        <select onchange="calc()">
          <option value="Janela" ${tipo==='Janela'?'selected':''}>Janela</option>
          <option value="Varanda" ${tipo==='Varanda'?'selected':''}>Varanda</option>
        </select>
      </div>
      <div><label>Largura (m)</label><input type="number" step="0.01" min="0" value="${larg ?? ''}" oninput="calc()"></div>
      <div><label>Altura (m)</label><input type="number" step="0.01" min="0" value="${alt ?? ''}" oninput="calc()"></div>
      <div><label>Qtd</label><input type="number" step="1" min="1" value="${qtd ?? 1}" oninput="calc()"></div>
      <button class="rm" onclick="document.getElementById('${id}').remove(); calc();">remover</button>
    `;
    document.getElementById('rows').appendChild(div);
    calc();
  }

  function readRows(){
    return [...document.querySelectorAll('.row-item')].map(row => {
      const [sel, larg, alt, qtd] = row.querySelectorAll('select, input');
      return { tipo: sel.value, larg: parseFloat(larg.value)||0, alt: parseFloat(alt.value)||0, qtd: parseInt(qtd.value)||1 };
    });
  }

  const fmt = v => 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});

  function calc(){
    const precoM2 = parseFloat(document.getElementById('precoM2').value) || 0;
    const aberturas = readRows();
    let area = 0, perim = 0;
    aberturas.forEach(a => { area += a.larg*a.alt*a.qtd; perim += 2*(a.larg+a.alt)*a.qtd; });
    const ganchos = perim > 0 ? Math.ceil(perim / M_LINEAR_POR_GANCHO) : 0;
    const total = area*precoM2 + perim*PRECO_CORDA_M + ganchos*PRECO_GANCHO_ZINCADO;

    document.getElementById('s-area').textContent = area.toLocaleString('pt-BR', {minimumFractionDigits:2});
    document.getElementById('s-perim').textContent = perim.toLocaleString('pt-BR', {minimumFractionDigits:1});
    document.getElementById('s-ganchos').textContent = ganchos;
    document.getElementById('s-total').textContent = fmt(total);
    document.getElementById('linkBox').classList.remove('show');
    return aberturas;
  }

  function gerar(){
    const precoM2 = parseFloat(document.getElementById('precoM2').value) || 0;
    const aberturas = readRows().filter(a => a.larg>0 && a.alt>0);
    if (aberturas.length === 0){ alert('Adicione pelo menos uma abertura com largura e altura.'); return; }
    let area = 0, perim = 0;
    aberturas.forEach(a => { area += a.larg*a.alt*a.qtd; perim += 2*(a.larg+a.alt)*a.qtd; });
    const ganchos = Math.ceil(perim / M_LINEAR_POR_GANCHO);
    const baseTotal = area*precoM2 + perim*PRECO_CORDA_M + ganchos*PRECO_GANCHO_ZINCADO;
    const desc = document.getElementById('desc').value || 'Rede de proteção';

    const data = { desc, precoM2, aberturas };
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(data))))
      .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    const url = `${PROPOSTA_URL}?d=${b64}`;
    document.getElementById('linkUrl').textContent = url;
    document.getElementById('linkOpen').href = url;
    document.getElementById('linkBox').classList.add('show');

    if (db){
      db.collection('orcamentos').add({
        desc, precoM2, area, perim, ganchos, baseTotal, link: url,
        createdAt: new Date().toISOString()
      }).then(carregarHistorico).catch(() => {});
    }
  }

  function copiarLink(){
    const url = document.getElementById('linkUrl').textContent;
    navigator.clipboard.writeText(url).then(() => {
      const btn = event.target;
      const old = btn.textContent;
      btn.textContent = 'Copiado!';
      setTimeout(() => btn.textContent = old, 1500);
    });
  }

  // linha inicial de exemplo
  addRow('Varanda', 4, 2.5, 1);
  addRow('Janela', 1.2, 1.4, 2);
</script>
</body>
</html>
